[project]
name = "harness-bloat-bench"
version = "0.1.0"
description = "Terminal-Bench rollout matrices with Verifiers v1 and Dagster."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster==1.13.13",
    "dagster-webserver==1.13.13",
    # Verifiers 0.2.0 depends on preview releases of these two packages. Listing
    # them directly lets uv admit only those previews instead of all prereleases.
    "prime-pydantic-config[toml]>=0.3.0.dev86",
    "renderers>=0.1.8.dev40",
    "verifiers[harbor]==0.2.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/harness_bloat_bench",
    "src/codex_agent",
    "src/claude_code_agent",
    "src/hermes_agent",
    "src/opencode",
    "src/omp_agent",
    "src/prime_agent",
]
